<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" preserveAspectRatio="none">
  <defs>
    <!-- subtle paper grain -->
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0.9 0 0 0 0  0 0.9 0 0 0  0 0 0.9 0 0  0 0 0 0.6 0" result="grain"/>
      <feBlend in="SourceGraphic" in2="grain" mode="overlay"/>
    </filter>
    <!-- small blotches to make it look aged -->
    <radialGradient id="blotch" cx="20%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#e9dfc2" />
      <stop offset="100%" stop-color="#dcca9f" />
    </radialGradient>
  </defs>

  <rect width="100%" height="100%" fill="#f6ecd9"/>
  <rect width="100%" height="100%" fill="url(#blotch)" opacity="0.12"/>

  <!-- subtle darker edges -->
  <rect x="0" y="0" width="100%" height="100%" fill="none" stroke="#e0d3b3" stroke-width="40" opacity="0.14"/>

  <g filter="url(#grain)">
    <rect width="100%" height="100%" fill="transparent" />
  </g>

</svg>
